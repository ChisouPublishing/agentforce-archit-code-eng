<template>
    <div class="slds-p-around_x-small">
        <div class="slds-media slds-media_center slds-m-bottom_small">
            <div class="slds-media__figure">
                <lightning-icon icon-name="standard:approval" size="small" alternative-text="Confirm"></lightning-icon>
            </div>
            <div class="slds-media__body">
                <h2 class="slds-text-heading_small">Confirm Your Return</h2>
                <p class="slds-text-body_small slds-text-color_weak">Review the details, then submit</p>
            </div>
        </div>
        <c-afd-return-steps current="confirm"></c-afd-return-steps>

        <template lwc:if={hasSummary}>
            <div class="slds-box slds-box_x-small slds-theme_shade slds-m-top_small slds-p-around_small">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end">
                    <div>
                        <p class="slds-text-title slds-text-color_weak">Order Number</p>
                        <p class="slds-text-heading_small">{orderNumber}</p>
                    </div>
                    <div class="slds-text-align_right">
                        <p class="slds-text-title slds-text-color_weak">Expected Refund</p>
                        <p class="slds-text-heading_medium">
                            <lightning-formatted-number value={refundAmount} format-style="currency" currency-code="USD"></lightning-formatted-number>
                        </p>
                    </div>
                </div>
            </div>
        </template>

        <div class="slds-scoped-notification slds-theme_warning slds-m-top_small" role="status">
            <div class="slds-media">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:warning" size="x-small" alternative-text="Warning"></lightning-icon>
                </div>
                <div class="slds-media__body slds-text-body_small">Submitting starts the return. To cancel it, you need to contact a support agent.</div>
            </div>
        </div>

        <div class="slds-m-top_small">
            <lightning-input type="checkbox" name="confirmed" required checked={confirmed}
                label="I have reviewed the details. Process my return as shown."
                message-when-value-missing="Check this box to confirm"
                onchange={handleChange} disabled={readOnly}></lightning-input>
        </div>
    </div>
</template>
